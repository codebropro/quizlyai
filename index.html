<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizly – leer slimmer met AI</title><meta name="description" content="Maak van elke tekst een quiz met AI. Flashcards en meerkeuze."><meta name="theme-color" content="#6d4aff"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🧠</text></svg>">
<style>
:root{--tx:#14123a;--mu:#5b5885;--ac:#6d4aff;--ac2:#b794ff;--ok:#16a34a;--bad:#dc2626;--bd:rgba(255,255,255,.55);--gl:rgba(255,255,255,.34);--gl2:rgba(255,255,255,.55);--in:rgba(255,255,255,.45);--sh:0 10px 40px rgba(70,40,180,.18);--bgA:#c7b8ff;--bgB:#8fd3ff;--bgC:#ffb8e1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tx:#f2f0ff;--mu:#aaa7d6;--bd:rgba(255,255,255,.14);--gl:rgba(30,26,70,.42);--gl2:rgba(60,52,130,.5);--in:rgba(255,255,255,.08);--sh:0 10px 40px rgba(0,0,0,.45);--bgA:#3b1fa8;--bgB:#0b4f8a;--bgC:#7a1f6b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:15px/1.5 -apple-system,"SF Pro Display",Inter,system-ui,Segoe UI,sans-serif;background:#e9e4ff;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){body{background:#0b0a1c}}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;background:var(--bgA);top:-10vw;left:-8vw}.bg i:nth-child(2){width:40vw;height:40vw;background:var(--bgB);bottom:-12vw;right:-6vw;animation-delay:-6s}.bg i:nth-child(3){width:32vw;height:32vw;background:var(--bgC);top:35%;left:42%;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vw,-5vw) scale(1.15)}}
button,input,textarea{font:inherit;color:inherit}
.glass,.card,aside,.opt,.tier,.fc section,textarea,input[type=text],input[type=password],.btn.ghost,.drop{background:linear-gradient(145deg,var(--gl2),var(--gl));backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1.5px 0 var(--in),inset 0 -1px 0 rgba(255,255,255,.12)}
.app{display:grid;grid-template-columns:240px 1fr;gap:18px;padding:18px;min-height:100vh}
aside{border-radius:26px;padding:20px 14px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:6px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;margin:0 8px 18px;display:flex;gap:10px;align-items:center}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 6px 16px rgba(109,74,255,.4)}
.nav{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;border:1px solid transparent;background:none;cursor:pointer;color:var(--mu);font-weight:600;text-align:left;width:100%;transition:.2s}
.nav:hover{background:var(--gl)}.nav.on{color:var(--tx);background:var(--gl2);border-color:var(--bd);box-shadow:inset 0 1px 0 var(--in)}
.plan{margin-top:auto;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(109,74,255,.9),rgba(167,139,250,.85));color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 10px 24px rgba(109,74,255,.35)}
.plan small{opacity:.9;display:block;margin:2px 0 10px}
main{padding:14px clamp(4px,2vw,28px);max-width:1100px;width:100%}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.8px}.sub{color:var(--mu);margin:0 0 24px}
.btn{border:0;border-radius:14px;padding:11px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--ac),#8b5cf6);color:#fff;transition:.2s;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 8px 20px rgba(109,74,255,.35)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.ghost{color:var(--tx)}.btn.w{background:#fff;color:var(--ac);box-shadow:0 4px 12px rgba(0,0,0,.15)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{border-radius:24px;padding:22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);pointer-events:none;border-radius:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.stat b{display:block;font-size:32px;letter-spacing:-1px}.stat span{color:var(--mu);font-size:13px}
.deck{cursor:pointer;transition:.25s}.deck:hover{transform:translateY(-5px) scale(1.01)}
.deck h3{margin:12px 0 4px;font-size:17px}.deck p{margin:0;color:var(--mu);font-size:13px}
.emo{font-size:26px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--gl2);box-shadow:inset 0 1.5px 0 var(--in)}
.bar{height:7px;border-radius:9px;background:var(--gl);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .4s}
textarea,input[type=text],input[type=password]{width:100%;padding:13px 15px;border-radius:16px;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}textarea:focus,input:focus{border-color:var(--ac)}textarea{min-height:190px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mt{margin-top:16px}
.drop{border-radius:20px;padding:28px;text-align:center;color:var(--mu);cursor:pointer;border-style:dashed;transition:.2s}.drop:hover,.drop.over{border-color:var(--ac);color:var(--ac)}
.fc{perspective:1200px;height:290px;cursor:pointer;max-width:660px;margin:20px auto}
.fc>div{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}.fc.f>div{transform:rotateY(180deg)}
.fc section{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:grid;place-items:center;padding:34px;text-align:center;font-size:23px;font-weight:700}
.fc section+section{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(109,74,255,.85),rgba(139,92,246,.8));color:#fff}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;margin-top:10px;border-radius:16px;cursor:pointer;font-weight:600;transition:.2s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.28)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.25)}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gl2);border:1px solid var(--bd);color:var(--ac)}
.modal{position:fixed;inset:0;background:rgba(15,10,50,.45);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(8px)}
.modal .card{max-width:780px;width:100%;max-height:90vh;overflow:auto}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}
.tier{border-radius:20px;padding:20px}.tier.pro{border-color:var(--ac);box-shadow:var(--sh),0 0 0 2px var(--ac),inset 0 1.5px 0 var(--in)}.tier h3{margin:0}.tier .pr{font-size:34px;font-weight:800;margin:6px 0}.tier ul{padding-left:18px;color:var(--mu);margin:10px 0 0}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1b1840;color:#fff;border:1px solid rgba(255,255,255,.3);padding:12px 22px;border-radius:16px;max-width:90vw;text-align:center;font-weight:600;z-index:99;box-shadow:var(--sh)}
.q{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.siteframe{width:100%;height:72vh;border:1px solid var(--bd);border-radius:20px;background:#fff}.legal{text-align:center;color:var(--mu);font-size:12px;padding:20px}.legal a{color:inherit}
@media(max-width:760px){.app{grid-template-columns:1fr;padding:10px}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px;border-radius:20px}.logo{margin:0 auto 0 0}.plan{display:none}.nav{width:auto;padding:9px 11px}}
</style></head><body>
<div class="bg"><i></i><i></i><i></i></div><div class="app" id="app"></div><div class="legal">© Quizly · <a href="#" onclick="return false">Privacy</a> · <a href="#" onclick="return false">Voorwaarden</a></div>
<script>
const CFG={PRICE_MONTH:"€4,99",PRICE_YEAR:"€39",PAY_LINK_MONTH:"https://buy.stripe.com/JOUW_MAANDLINK",PAY_LINK_YEAR:"https://buy.stripe.com/JOUW_JAARLINK",FREE_SETS:10,FREE_AI:5};
const API="/api",EMO=["📘","🧠","🧪","🌍","📐","⚖️","💡","🎨","🔬","📜"],AV=["😀","😎","🤓","🦊","🐼","🦄","🐸","🚀","🎧","🌈"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem={},ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let S={token:ls.get("qt"),user:null,decks:[],aiLeft:0,studied:+ls.get("qs")||0,streak:+ls.get("qk")||0};
let V={html:"",htmlName:"",page:"home",deck:null,txt:"",busy:false,tab:"login",pub:null,prof:null,list:[],q:"",back:"home"};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
async function api(action,d={}){let r,j;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token:S.token,...d})});j=await r.json()}catch(e){throw {error:r&&r.status===404?"Server ontbreekt: zet de site via GitHub op Netlify (niet slepen)":"Server niet bereikbaar ("+(r?r.status:"offline")+")"}}if(!r.ok){if(r.status===401&&!["login","register"].includes(action))logout();throw j}return j}
function logout(){S.token=null;S.user=null;ls.set("qt",null);render()}
let tm;const sync=()=>{clearTimeout(tm);tm=setTimeout(()=>api("saveDecks",{decks:S.decks}).catch(e=>toast(e.error||"Opslaan mislukt")),600)};
const go=(p,x)=>{V.page=p;if(x!==undefined)V.deck=x;render();scrollTo(0,0)};
const D=()=>V.deck==="pub"?V.pub:S.decks.find(d=>d.id===V.deck);
const mine=()=>V.deck!=="pub";
const stat=()=>{ls.set("qs",S.studied);ls.set("qk",S.streak)};
// ===== RENDER =====
function render(){
  if(!S.user){$("#app").innerHTML=authV();return}
  const u=S.user,pro=u.pro;
  $("#app").innerHTML=`<aside><div class="logo"><i>Q</i>Quizly</div>
  ${[["home","🏠","Dashboard"],["create","✨","AI quiz"],["build","✏️","Zelf maken"],["import","📤","Importeren"],["explore","🌍","Ontdekken"],["me","👤","Profiel"]].map(([p,i,l])=>`<button class="nav ${V.page===p?"on":""}" onclick="${p==="explore"?"openExplore()":p==="me"?"openProf('"+u.name+"')":"go('"+p+"')"}">${i} ${l}</button>`).join("")}
  <div class="plan">${pro?"<b>Quizly Pro ✓</b><small>Onbeperkt alles</small>":`<b>Gratis plan</b><small>AI vandaag: ${S.aiLeft}/${CFG.FREE_AI} over<br>Sets: ${S.decks.length}/${CFG.FREE_SETS}</small><button class="btn w" onclick="pay()">Upgrade</button>`}</div></aside>
  <main>${({home,create,build,import:imp,explore,me:profV,pub:pubV,site,deck:deckV,flash,quiz})[V.page]()}</main>`;if(V.page==="site"&&$("#sf"))$("#sf").srcdoc=V.html;
}
function authV(){const L=V.tab==="login";
  return `<div style="grid-column:1/-1;display:grid;place-items:center;min-height:90vh"><div class="card" style="max-width:400px;width:100%"><div class="logo" style="justify-content:center"><i>Q</i>Quizly</div>
  <h2 style="text-align:center;margin:0 0 4px">${L?"Welkom terug":"Maak een account"}</h2><p class="sub" style="text-align:center">Quizzen maken met AI en delen met anderen.</p>
  <input type="text" id="un" placeholder="Gebruikersnaam" autocapitalize="none"><input type="password" id="pw" placeholder="Wachtwoord (min. 8 tekens)" class="mt" style="width:100%;padding:13px 15px;border-radius:16px;outline:none;background:var(--gl);border:1px solid var(--bd);color:var(--tx)" onkeydown="if(event.key==='Enter')auth()">
  <button class="btn mt" style="width:100%" onclick="auth()">${L?"Inloggen":"Registreren"}</button>
  <p class="sub mt" style="text-align:center;margin:16px 0 0">${L?"Nog geen account?":"Al een account?"} <a href="#" style="color:var(--ac)" onclick="V.tab='${L?"reg":"login"}';render();return false">${L?"Registreer":"Log in"}</a></p></div></div>`}
async function auth(){try{const r=await api(V.tab==="login"?"login":"register",{name:$("#un").value,password:$("#pw").value});S.token=r.token;ls.set("qt",r.token);await boot()}catch(e){toast(e.error||"Mislukt")}}
async function boot(){if(!S.token)return render();try{const r=await api("me");S.user=r.user;S.decks=r.decks;S.aiLeft=r.aiLeft}catch(e){}render()}
function home(){const c=S.decks.reduce((a,d)=>a+d.cards.length,0);
  return `<h1>Hoi ${esc(S.user.name)} ${S.user.emo} 👋</h1><p class="sub">Maak van elke tekst een quiz en leer sneller.</p>
  <div class="stats"><div class="card stat"><b>${S.decks.length}</b><span>Sets</span></div><div class="card stat"><b>${c}</b><span>Kaarten</span></div><div class="card stat"><b>${S.studied}</b><span>Beantwoord</span></div><div class="card stat"><b>${S.streak}🔥</b><span>Beste reeks</span></div></div>
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Jouw sets</h2><div class="row"><button class="btn ghost" onclick="go('build')">✏️ Zelf maken</button><button class="btn" onclick="go('create')">✨ AI quiz</button></div></div>
  ${S.decks.length?`<div class="grid">${S.decks.map(d=>deckCard(d,`go('deck','${d.id}')`)).join("")}</div>`:`<div class="card empty"><div style="font-size:44px">📚</div><h3>Nog geen quizzen</h3><p>Maak er een met AI, bouw er zelf een, of speel die van anderen.</p><button class="btn" onclick="openExplore()">🌍 Ontdekken</button></div>`}`}
const deckCard=(d,oc,extra="")=>`<div class="card deck" onclick="${oc}"><div class="emo">${esc(d.emo)}</div><h3>${esc(d.title)}</h3><p>${d.cards?d.cards.length:d.n} kaarten${extra}</p>${d.best!=null?`<div class="bar"><i style="width:${d.best}%"></i></div>`:""}</div>`;
function create(){return `<h1>Maak een quiz met AI ✨</h1><p class="sub">Plak je tekst. De AI maakt er vragen van. ${S.user.pro?"":`<span class="pill">${S.aiLeft} gratis vandaag</span>`}</p>
  <div class="card"><textarea id="txt" placeholder="Plak hier je tekst…" oninput="V.txt=this.value">${esc(V.txt)}</textarea>
  <div class="row mt"><label class="row">Aantal kaarten <input type="text" id="n" value="10" style="width:70px"></label><button class="btn" onclick="gen()" ${V.busy?"disabled":""}>${V.busy?"AI is aan het werk…":"Genereer quiz"}</button><button class="btn ghost" onclick="go('import')">Of upload een bestand</button></div></div>`}
async function gen(){const text=V.txt.trim();if(text.length<40)return toast("Plak eerst een langere tekst");
  if(!S.user.pro&&S.decks.length>=CFG.FREE_SETS)return pay("Gratis plan: maximaal "+CFG.FREE_SETS+" sets.");
  if(!S.user.pro&&S.aiLeft<=0)return pay("Je 5 gratis AI-quizzen van vandaag zijn op.");
  V.busy=true;render();
  try{const r=await api("generate",{text:text.slice(0,12000),n:Math.min(30,Math.max(3,parseInt($("#n").value)||10))});S.aiLeft=r.aiLeft;V.txt="";addDeck(r.title||"Nieuwe quiz",r.cards);toast("Quiz klaar! 🎉")}
  catch(e){if(e.error==="limit")pay("Je 5 gratis AI-quizzen van vandaag zijn op.");else toast(e.error||"Genereren mislukt")}
  V.busy=false;if(V.page==="create")render()}
function addDeck(title,cards){cards=(cards||[]).filter(c=>c.q&&c.a);if(!cards.length)return toast("Geen kaarten gevonden");
  if(!S.user.pro&&S.decks.length>=CFG.FREE_SETS)return pay("Gratis plan: maximaal "+CFG.FREE_SETS+" sets.");
  const d={id:"d"+Date.now(),title,emo:EMO[Math.floor(Math.random()*EMO.length)],cards,best:null};S.decks.unshift(d);sync();go("deck",d.id)}
// ===== HANDMATIG MAKEN =====
let B={title:"",cards:[{q:"",a:"",w:["","",""]}]};
function build(){const inp=(v,ph,f)=>`<input type="text" value="${esc(v)}" placeholder="${ph}" oninput="${f}=this.value">`;
  return `<h1>Zelf een quiz maken ✏️</h1><p class="sub">Voeg vragen toe. Foute antwoorden zijn optioneel; anders kiest Quizly ze uit je andere antwoorden.</p>
  <div class="card">${inp(B.title,"Titel van je quiz","B.title")}
  ${B.cards.map((c,i)=>`<div class="mt" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><b>Kaart ${i+1}</b>${B.cards.length>1?`<button class="btn ghost" onclick="B.cards.splice(${i},1);render()">✕</button>`:""}</div>
  ${inp(c.q,"Vraag",`B.cards[${i}].q`)}${inp(c.a,"Juist antwoord",`B.cards[${i}].a`)}<div class="row">${c.w.map((w,j)=>`<input type="text" style="flex:1;min-width:120px" value="${esc(w)}" placeholder="Fout antwoord ${j+1}" oninput="B.cards[${i}].w[${j}]=this.value">`).join("")}</div></div>`).join("")}
  <div class="row mt"><button class="btn ghost" onclick="B.cards.push({q:'',a:'',w:['','','']});render()">+ Kaart</button><button class="btn" onclick="saveBuild()">Opslaan</button></div></div>`}
function saveBuild(){const cards=B.cards.filter(c=>c.q.trim()&&c.a.trim()).map(c=>({q:c.q.trim(),a:c.a.trim(),wrong:c.w.map(x=>x.trim()).filter(Boolean)}));
  if(!B.title.trim())return toast("Geef je quiz een titel");const t=B.title.trim();B={title:"",cards:[{q:"",a:"",w:["","",""]}]};addDeck(t,cards)}
// ===== IMPORT =====
function imp(){return `<h1>Quiz importeren 📤</h1><p class="sub">.json of .csv (vraag;antwoord) wordt direct een set. .txt of .md gaat naar de AI. Een .html-website opent hier in Quizly.</p>
  <div class="card"><div class="drop" onclick="$('#f').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();upl(event.dataTransfer.files[0])"><div style="font-size:36px">📄</div><b>Klik of sleep een bestand</b><br>JSON, CSV, TXT, MD, HTML (website)</div><input type="file" id="f" accept=".json,.csv,.txt,.md,.html,.htm,text/html" hidden onchange="upl(this.files[0])"></div>`}
function upl(f){if(!f)return;const r=new FileReader();r.onload=()=>{const t=String(r.result),name=f.name.replace(/\.\w+$/,"");
  try{if(/\.json$/i.test(f.name)){let j=JSON.parse(t);j=Array.isArray(j)?{title:name,cards:j}:j;return addDeck(j.title||name,(j.cards||[]).map(c=>({q:c.q||c.question||c.vraag,a:c.a||c.answer||c.antwoord,wrong:c.wrong||[]})))}
  if(/\.csv$/i.test(f.name))return addDeck(name,t.split(/\r?\n/).map(l=>l.split(/[;\t]|,(?=[^,]*$)/).map(x=>x.trim().replace(/^"|"$/g,""))).filter(p=>p.length>=2&&p[0]&&p[1]).map(p=>({q:p[0],a:p[1],wrong:[]})));
  if(/\.html?$/i.test(f.name)||/html/i.test(f.type)){V.html=t;V.htmlName=name;return go("site")}
  V.txt=t;go("create");toast("Tekst geladen")}catch(e){toast("Kon bestand niet lezen")}};r.readAsText(f)}
// ===== ONTDEKKEN & PROFIEL =====
async function openExplore(){V.page="explore";V.back="explore";render();await search()}
async function search(){try{V.list=(await api("browse",{q:V.q})).list}catch(e){V.list=[]}if(V.page==="explore")render()}
function explore(){return `<h1>Ontdek quizzen 🌍</h1><p class="sub">Speel quizzen van andere mensen en bewaar ze in je eigen sets.</p>
  <div class="row" style="margin-bottom:18px"><input type="text" id="sq" value="${esc(V.q)}" placeholder="Zoek op titel of maker…" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter'){V.q=this.value;search()}"><button class="btn" onclick="V.q=$('#sq').value;search()">Zoek</button></div>
  ${V.list.length?`<div class="grid">${V.list.map(d=>deckCard(d,`openPub('${d.id}')`,` · door ${esc(d.author)} · ❤ ${d.likes}`)).join("")}</div>`:`<div class="card empty"><div style="font-size:44px">🔎</div><p>Nog niets gevonden. Publiceer als eerste een quiz!</p></div>`}`}
async function openPub(id){try{V.pub=(await api("get",{id})).quiz;V.deck="pub";go("deck","pub")}catch(e){toast("Quiz niet gevonden")}}
async function openProf(n){V.back="home";try{V.prof=await api("profile",{name:n});go("me")}catch(e){toast("Profiel niet gevonden")}}
function profV(){const p=V.prof;if(!p){openProf(S.user.name);return ""}const own=p.name===S.user.name;
  return `<div class="card" style="text-align:center"><div style="font-size:64px">${esc(p.emo)}</div><h1 style="margin:6px 0 2px">@${esc(p.name)} ${p.pro?'<span class="pill">PRO</span>':""}</h1><p class="sub" style="margin:0">${esc(p.bio||"Nog geen bio")}</p>
  ${own?`<div class="row mt" style="justify-content:center">${AV.map(a=>`<button class="btn ghost" style="padding:6px 10px" onclick="V.prof.emo='${a}';render()">${a}</button>`).join("")}</div>
  <input type="text" id="bio" class="mt" maxlength="140" placeholder="Schrijf een korte bio" value="${esc(p.bio||"")}"><div class="row mt" style="justify-content:center"><button class="btn" onclick="saveProf()">Opslaan</button><button class="btn ghost" onclick="logout()">Uitloggen</button></div>`:""}</div>
  <h2 class="mt">Gepubliceerde quizzen</h2>${p.quizzes.length?`<div class="grid">${p.quizzes.map(d=>deckCard(d,`openPub('${d.id}')`,` · ❤ ${d.likes}`)).join("")}</div>`:`<div class="card empty">Nog geen gepubliceerde quizzen.</div>`}`}
async function saveProf(){try{await api("updateProfile",{emo:V.prof.emo,bio:$("#bio").value});S.user.emo=V.prof.emo;S.user.bio=$("#bio").value;toast("Opgeslagen");render()}catch(e){toast("Mislukt")}}
function pubV(){return ""}
function site(){return `<button class="btn ghost" onclick="go('import')">← Terug</button><div class="row mt" style="justify-content:space-between"><div><h1 style="margin:0">🌐 ${esc(V.htmlName)}</h1><p class="sub" style="margin:0">Je website, geopend in Quizly</p></div><button class="btn" onclick="siteQuiz()">✨ Maak quiz van deze pagina</button></div><iframe id="sf" class="siteframe mt" sandbox="allow-scripts allow-popups allow-forms"></iframe>`}
function siteQuiz(){const d=new DOMParser().parseFromString(V.html,"text/html");d.querySelectorAll("script,style,noscript,template,svg,iframe,head").forEach(e=>e.remove());const x=(d.body?d.body.innerText||d.body.textContent:"").replace(/[ \t]+/g," ").replace(/\n\s*\n+/g,"\n\n").trim();if(x.length<40)return toast("Te weinig tekst op deze pagina");V.txt=x;go("create");toast("Tekst van de pagina geladen")}
// ===== SET =====
function deckV(){const d=D();if(!d){go("home");return""}const m=mine();
  return `<button class="btn ghost" onclick="go('${m?"home":V.back}')">← Terug</button>
  <div class="row mt" style="justify-content:space-between"><div><h1>${esc(d.emoji||d.emo)} ${esc(d.title)}</h1><p class="sub">${d.cards.length} kaarten${m?"":` · door <a href="#" style="color:var(--ac)" onclick="openProf('${esc(d.author)}');return false">@${esc(d.author)}</a>`}</p></div>
  <div class="row"><button class="btn" onclick="startFlash()">🃏 Flashcards</button><button class="btn" onclick="startQuiz()">🎯 Quiz</button>
  ${m?`<button class="btn ghost" onclick="publish()">🌍 Publiceren</button><button class="btn ghost" onclick="exp()">⬇</button><button class="btn ghost" onclick="del()">🗑</button>`:`<button class="btn ghost" onclick="like()">❤ ${d.likes}</button><button class="btn ghost" onclick="copyPub()">➕ Bewaar</button>`}</div></div>
  <div class="card">${d.cards.map((c,i)=>`<div class="q"><div><b>${esc(c.q)}</b><br><span style="color:var(--mu)">${esc(c.a)}</span></div>${m?`<button class="btn ghost" onclick="D().cards.splice(${i},1);sync();render()">✕</button>`:""}</div>`).join("")}</div>`}
async function publish(){try{await api("saveDecks",{decks:S.decks});await api("publish",{deckId:V.deck});toast("Gepubliceerd 🌍")}catch(e){toast(e.error||"Mislukt")}}
async function like(){try{const r=await api("like",{id:V.pub.id});V.pub.likes=r.likes;render()}catch(e){toast("Mislukt")}}
function copyPub(){const p=V.pub;V.deck=null;addDeck(p.title,p.cards.map(c=>({q:c.q,a:c.a,wrong:c.wrong||[]})))}
function exp(){const d=D(),u=URL.createObjectURL(new Blob([JSON.stringify({title:d.title,cards:d.cards},null,2)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download=d.title.replace(/\W+/g,"_")+".json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function del(){if(confirm("Deze set verwijderen?")){S.decks=S.decks.filter(d=>d.id!==V.deck);sync();go("home")}}
// ===== STUDEREN =====
let F={i:0,flip:false},Q={i:0,sc:0,list:[],done:false,ans:null,run:0};
function startFlash(){F={i:0,flip:false};go("flash")}
function flash(){const d=D(),c=d.cards[F.i],n=d.cards.length;
  return `<button class="btn ghost" onclick="go('deck')">← Terug</button><div style="text-align:center;margin-top:20px"><span class="pill">${F.i+1} / ${n}</span><div class="fc ${F.flip?"f":""}" onclick="F.flip=!F.flip;render()"><div><section>${esc(c.q)}</section><section>${esc(c.a)}</section></div></div><p class="sub">Klik om te draaien</p>
  <div class="row" style="justify-content:center"><button class="btn ghost" onclick="F.i=(F.i-1+${n})%${n};F.flip=false;render()">← Vorige</button><button class="btn" onclick="F.i=(F.i+1)%${n};F.flip=false;render()">Volgende →</button></div></div>`}
function startQuiz(){const d=D();if(d.cards.length<2)return toast("Minstens 2 kaarten nodig");const pool=d.cards.map(c=>c.a);
  Q={i:0,sc:0,done:false,ans:null,run:0,list:[...d.cards].sort(()=>Math.random()-.5).map(c=>{let w=(c.wrong||[]).filter(x=>x&&x!==c.a).slice(0,3);const o=pool.filter(x=>x!==c.a&&!w.includes(x)).sort(()=>Math.random()-.5);while(w.length<3&&o.length)w.push(o.pop());return{q:c.q,a:c.a,o:[c.a,...w].sort(()=>Math.random()-.5)}})};go("quiz")}
function quiz(){if(Q.done){const p=Math.round(Q.sc/Q.list.length*100);return `<div class="card empty"><div style="font-size:54px">${p>=80?"🏆":p>=50?"👍":"💪"}</div><h1>${p}%</h1><p>${Q.sc} van ${Q.list.length} goed</p><div class="row" style="justify-content:center"><button class="btn" onclick="startQuiz()">Opnieuw</button><button class="btn ghost" onclick="go('deck')">Klaar</button></div></div>`}
  const c=Q.list[Q.i];return `<button class="btn ghost" onclick="go('deck')">← Stop</button><div style="max-width:660px;margin:20px auto"><span class="pill">Vraag ${Q.i+1} / ${Q.list.length}</span><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div><h2 style="margin:22px 0 8px">${esc(c.q)}</h2>
  ${c.o.map((o,i)=>`<button class="opt ${Q.ans!=null?(o===c.a?"ok":i===Q.ans?"no":""):""}" ${Q.ans!=null?"disabled":""} onclick="pick(${i})">${esc(o)}</button>`).join("")}${Q.ans!=null?`<button class="btn mt" onclick="nextQ()">${Q.i+1===Q.list.length?"Resultaat":"Volgende"} →</button>`:""}</div>`}
function pick(i){const c=Q.list[Q.i];Q.ans=i;S.studied++;if(c.o[i]===c.a){Q.sc++;Q.run++;S.streak=Math.max(S.streak,Q.run)}else Q.run=0;stat();render()}
function nextQ(){Q.ans=null;if(++Q.i>=Q.list.length){Q.done=true;if(mine()){const d=D(),p=Math.round(Q.sc/Q.list.length*100);d.best=Math.max(d.best||0,p);sync()}}render()}
// ===== PRO =====
function pay(reason){const m=document.createElement("div");m.className="modal";m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="card"><h2 style="margin:0">${reason||"Upgrade naar Quizly Pro"} 💎</h2><p class="sub" style="margin:4px 0 0">Leer zonder grenzen.</p>
  <div class="tiers"><div class="tier"><h3>Gratis</h3><div class="pr">€0</div><ul><li>${CFG.FREE_SETS} sets</li><li>${CFG.FREE_AI} AI-quizzen per dag</li><li>Delen en ontdekken</li></ul></div>
  <div class="tier pro"><h3>Pro <span class="pill">Populair</span></h3><div class="pr">${CFG.PRICE_MONTH}<small style="font-size:14px;color:var(--mu)">/maand</small></div><ul><li>Onbeperkt sets</li><li>Onbeperkt AI-quizzen</li><li>Pro-badge</li></ul><a href="${CFG.PAY_LINK_MONTH}" target="_blank" rel="noopener"><button class="btn mt" style="width:100%">Maandelijks</button></a></div>
  <div class="tier"><h3>Jaar</h3><div class="pr">${CFG.PRICE_YEAR}<small style="font-size:14px;color:var(--mu)">/jaar</small></div><ul><li>Alles van Pro</li><li>Bespaar 35%</li></ul><a href="${CFG.PAY_LINK_YEAR}" target="_blank" rel="noopener"><button class="btn mt" style="width:100%">Jaarlijks</button></a></div></div>
  <div class="row"><input type="text" id="lic" placeholder="Licentiecode" style="flex:1;min-width:180px"><button class="btn ghost" id="act">Activeer</button></div></div>`;
  document.body.appendChild(m);m.querySelector("#act").onclick=async()=>{try{await api("redeem",{code:m.querySelector("#lic").value});S.user.pro=true;m.remove();render();toast("Pro geactiveerd 🎉")}catch(e){toast("Ongeldige code")}}}
boot();
</script></body></html>
